<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>需求图纸 · SVG 图标版（iconfont）</title>
<style>
    :root {
        --pzz_blue: #10395B;
        --pzz_blue_deep: #0C2C48;
        --pzz_chalk: #EDF3F8;
        --pzz_chalk_soft: rgba(237, 243, 248, 0.72);
        --pzz_line: rgba(237, 243, 248, 0.2);
        --pzz_highlight: #9CC4E4;
        --pzz_alarm: #E5484D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: var(--pzz_blue);
        background-image:
            linear-gradient(rgba(237, 243, 248, 0.09) 1px, transparent 1px),
            linear-gradient(90deg, rgba(237, 243, 248, 0.09) 1px, transparent 1px),
            linear-gradient(rgba(237, 243, 248, 0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(237, 243, 248, 0.045) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
        color: var(--pzz_chalk);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 16px;
        line-height: 1.75;
        min-height: 100vh;
        padding-bottom: 120px;
    }
    .pzz_page {
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 22px 40px;
    }
    .pzz_head_title {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.22em;
        padding-bottom: 14px;
        border-bottom: 1.5px solid var(--pzz_chalk);
    }
    .pzz_head_sub { font-size: 14px; color: var(--pzz_chalk_soft); margin-top: 10px; }
    .pzz_head_code {
        display: inline-block;
        margin-top: 14px;
        font-family: Consolas, monospace;
        font-size: 13px;
        color: var(--pzz_highlight);
        background: rgba(156, 196, 228, 0.1);
        padding: 5px 10px;
    }
    .pzz_demo_note {
        margin-top: 26px;
        font-size: 14px;
        color: var(--pzz_chalk_soft);
        border-top: 1px solid var(--pzz_line);
        padding-top: 16px;
    }
    .pzz_links { margin-top: 22px; display: flex; gap: 16px; flex-wrap: wrap; }
    .pzz_home_link, .pzz_alt_link {
        color: var(--pzz_chalk);
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 0.08em;
        padding: 8px 20px;
        border: 1.5px solid var(--pzz_chalk);
    }
    .pzz_home_link:hover, .pzz_alt_link:hover { background: rgba(237, 243, 248, 0.14); }
    .pzz_home_link:focus-visible, .pzz_alt_link:focus-visible,
    .pzz_tab:focus-visible {
        outline: 2px dashed var(--pzz_highlight);
        outline-offset: 3px;
    }

    /* ==== 固定底栏：flex 自适应宽度，4 项均分 ==== */
    .pzz_tabbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: flex;
        background: var(--pzz_blue_deep);
        border-top: 1px solid var(--pzz_line);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .pzz_tab {
        flex: 1 1 25%;          /* 自适应宽度：4 项均分 */
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 9px 4px 8px;
        text-decoration: none;
        color: var(--pzz_chalk_soft);
        -webkit-tap-highlight-color: transparent;
    }
    .pzz_tab_icon {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
    }
    .pzz_tab_svg {
        width: 24px;
        height: 24px;
        fill: currentColor;     /* symbol 路径继承颜色 */
        display: block;
    }
    .pzz_tab_label { font-size: 12px; letter-spacing: 0.06em; }
    .pzz_tab_active { color: var(--pzz_highlight); }
    .pzz_tab_active .pzz_tab_label { font-weight: 600; }
    .pzz_tab:active { opacity: 0.75; }

    /* ==== 徽章：数字 / 红点，钉在图标右上角 ==== */
    .pzz_badge_num {
        position: absolute;
        top: -7px;
        right: -18px;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 9px;
        background: var(--pzz_alarm);
        color: #FFFFFF;
        font-family: Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        line-height: 17px;
        text-align: center;
        font-style: normal;
    }
    .pzz_badge_dot {
        position: absolute;
        top: -1px;
        right: -10px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--pzz_alarm);
    }
</style>
</head>
<body>
<div class="pzz_page">
    <header>
        <h1 class="pzz_head_title">需求图纸</h1>
        <p class="pzz_head_sub">底部导航 · SVG 图标版 —— 图标由 symbol 矢量引用渲染</p>
        <code class="pzz_head_code">&lt;svg&gt;&lt;use href="#icon-xxx"&gt;&lt;/use&gt;&lt;/svg&gt;</code>
    </header>

    <p class="pzz_demo_note">
        iconfont.js 将全部图标以 symbol 形式注入页面，底栏图标经 use 引用对应矢量路径；
        四个项目弹性均分宽度，数字徽章与红点钉在图标右上角。点击项目可切换选中态。
    </p>

    <div class="pzz_links">
        <a class="pzz_alt_link" href="iconfont-3.html">字体图标版</a>
        <a class="pzz_alt_link" href="iconfont-2.html">图标图纸</a>
        <a class="pzz_home_link" href="index.html">返回首页</a>
    </div>
</div>

<!-- 本地 iconfont.js：注入 SVG symbol 雪碧图 -->
<script src="font/iconfont.js"></script>

<!-- 固定底栏：4 项，flex 均分 -->
<nav class="pzz_tabbar" aria-label="底部导航">
    <a class="pzz_tab pzz_tab_active" href="javascript:void(0)">
        <span class="pzz_tab_icon">
            <svg class="pzz_tab_svg" aria-hidden="true"><use href="#icon-a-wendangleibiexiao_huaban1fuben10"></use></svg>
        </span>
        <span class="pzz_tab_label">设计</span>
    </a>
    <a class="pzz_tab" href="javascript:void(0)">
        <span class="pzz_tab_icon">
            <svg class="pzz_tab_svg" aria-hidden="true"><use href="#icon-a-wendangleibiexiao_huaban1fuben11"></use></svg>
            <b class="pzz_badge_num">6</b>
        </span>
        <span class="pzz_tab_label">性能</span>
    </a>
    <a class="pzz_tab" href="javascript:void(0)">
        <span class="pzz_tab_icon">
            <svg class="pzz_tab_svg" aria-hidden="true"><use href="#icon-a-wendangleibiexiao_huaban1fuben12"></use></svg>
            <b class="pzz_badge_num">99+</b>
        </span>
        <span class="pzz_tab_label">接口</span>
    </a>
    <a class="pzz_tab" href="javascript:void(0)">
        <span class="pzz_tab_icon">
            <svg class="pzz_tab_svg" aria-hidden="true"><use href="#icon-a-wendangleibiexiao_huaban1fuben16"></use></svg>
            <b class="pzz_badge_dot"></b>
        </span>
        <span class="pzz_tab_label">安全</span>
    </a>
</nav>

<script>
    // 点击切换选中态
    var pzz_tabs = document.querySelectorAll('.pzz_tab');
    pzz_tabs.forEach(function (pzz_item) {
        pzz_item.addEventListener('click', function () {
            pzz_tabs.forEach(function (pzz_t) { pzz_t.classList.remove('pzz_tab_active'); });
            pzz_item.classList.add('pzz_tab_active');
        });
    });
</script>
</body>
</html>
